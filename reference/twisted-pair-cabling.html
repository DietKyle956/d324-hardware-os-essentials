    <tr><td><strong>Cat 5</strong></td><td>100 Mbps</td></tr>

  <h2>Memory hook</h2>
  <p><strong>Cat 3 = 10 Mbps.</strong> Then 5 = 100, 5e = 1000, 6a = 10G.</p>
